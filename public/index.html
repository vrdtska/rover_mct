<!DOCTYPE html>
<html>
<head>
    <title>NASA Open MCT - Rover Lunar</title>
    <script src="/node_modules/openmct/dist/openmct.js"></script>
</head>
<body style="margin: 0; height: 100vh;">
    <div id="element-container" style="width: 100%; height: 100%;"></div>
    <script>
        openmct.setAssetPath('/node_modules/openmct/dist');
        openmct.install(openmct.plugins.DarkmatterTheme());
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.MyItems());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.time.setClock('local');
        openmct.time.setClockOffsets({start: -15 * 60 * 1000, end: 0});
        openmct.time.setTimeSystem('utc');

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        const listeners = {};

        ws.onmessage = function (event) {
            const packet = JSON.parse(event.data);
            if (listeners[packet.id]) {
                listeners[packet.id]({
                    id: packet.id,
                    utc: packet.utc, // Fixed: was packet.timestamp
                    value: packet.value
                });
            }
        };

        openmct.telemetry.addProvider({
            supportsSubscribe: function (domainObject) {
                return domainObject.type === 'telemetry';
            },
            supportsRequest: function (domainObject) {
                return domainObject.type === 'telemetry';
            },

            subscribe: function (domainObject, callback) {
                listeners[domainObject.identifier.key] = callback;
                return function unsubscribe() {
                    delete listeners[domainObject.identifier.key];
                };
            },

            request: function (domainObject, options) {
                return Promise.resolve([]);
            }
        });

        // Cargar el diccionario JSON con datos de telemetría
        fetch('/dictionary.json')
            .then(res => res.json())
            .then(dictionary => {

                // 1. Proveedor de Objetos (Mapea las llaves a objetos de Open MCT)
                openmct.objects.addProvider('rover.spacecraft', {
                    get: async function (identifier) {
                        if (identifier.key === 'rover') {
                            return {
                                identifier: identifier,
                                name: dictionary.name,
                                type: 'folder',
                                location: 'ROOT'
                            };
                        }
                        
                        const measurement = dictionary.measurements.find(m => m.key === identifier.key);
                        if (!measurement){
                            return {
                                identifier: identifier,
                                name: identifier.key, 
                                type: 'unknown'
                            };
                        }

                        return {
                            identifier: identifier,
                            name: measurement.name,
                            type: 'telemetry',
                            telemetry: {
                                values: [
                                    { 
                                        key: 'value', 
                                        name: 'Valor', 
                                        units: measurement.units, 
                                        format: 'float', 
                                        hints: { range: 1 } 
                                    },
                                    { 
                                        key: 'utc', 
                                        name: 'Tiempo', 
                                        format: 'utc', 
                                        hints: { domain: 1 } 
                                    }
                                ]
                            },
                            location: 'rover.spacecraft:rover'
                        };
                    }
                });

                openmct.composition.addProvider({
                    appliesTo: function (domainObject) {
                        return domainObject.identifier.namespace === 'rover.spacecraft' && domainObject.identifier.key === 'rover';
                    },
                    load: async function (domainObject) {
                        // Mapea cada medición del diccionario como un hijo de la carpeta raíz
                        return dictionary.measurements.map(m => {
                            return {
                                namespace: 'rover.spacecraft',
                                key: m.key
                            };
                        });
                    }
                });

                // 1. Declarar el tipo personalizado
                openmct.types.addType('rover.view.trajectory', {
                    name: 'Trayectoria 2D Rover',
                    description: 'Plano cartesiano en tiempo real para posición X vs Y',
                    cssClass: 'icon-target'
                });

                // 2. Crear la vista personalizada con Canvas
                openmct.views.addProvider({
                    key: 'rover-2d-trajectory-view',
                    name: 'Plano 2D',
                    canView(domainObject) {
                        return domainObject.type === 'rover.view.trajectory';
                    },
                    view(domainObject) {
                        let unsubscribeX, unsubscribeY, unsubscribeTheta;
                        let posX = 0, posY = 0, theta = 0;
                        const trail = [];
                        const maxPoints = 500;

                        return {
                            show(container) {
                                container.innerHTML = `
                                    <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1e1e1e;">
                                        <canvas id="roverCanvas" width="600" height="600" style="background:#111; border:1px solid #333;"></canvas>
                                        <div id="coordsInfo" style="color:#aaa; font-family:monospace; margin-top:8px;">
                                            X: 0.00 m | Y: 0.00 m | θ: 0.00 rad
                                        </div>
                                    </div>
                                `;

                                const canvas = container.querySelector('#roverCanvas');
                                const ctx = canvas.getContext('2d');
                                const coordsDiv = container.querySelector('#coordsInfo');

                                const scale = 30; // 30 px equivalen a 1 metro
                                const originX = canvas.width / 2;
                                const originY = canvas.height / 2;

                                function render() {
                                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                                    // Ejes cartesianos
                                    ctx.strokeStyle = '#2d3748';
                                    ctx.lineWidth = 1;
                                    ctx.beginPath();
                                    ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY);
                                    ctx.moveTo(originX, 0); ctx.lineTo(originX, canvas.height);
                                    ctx.stroke();

                                    // Dibujar rastro (trayectoria histórica)
                                    if (trail.length > 1) {
                                        ctx.strokeStyle = '#38bdf8';
                                        ctx.lineWidth = 2;
                                        ctx.beginPath();
                                        trail.forEach((pt, i) => {
                                            const cx = originX + pt.x * scale;
                                            const cy = originY - pt.y * scale; // Invertir Y para coordenadas cartesianas
                                            if (i === 0) ctx.moveTo(cx, cy);
                                            else ctx.lineTo(cx, cy);
                                        });
                                        ctx.stroke();
                                    }

                                    // Dibujar Rover actual
                                    const currentCx = originX + posX * scale;
                                    const currentCy = originY - posY * scale;

                                    ctx.save();
                                    ctx.translate(currentCx, currentCy);
                                    ctx.rotate(-theta); // Rotación en sentido antihorario

                                    // Cuerpo del rover
                                    ctx.fillStyle = '#ef4444';
                                    ctx.beginPath();
                                    ctx.arc(0, 0, 8, 0, 2 * Math.PI);
                                    ctx.fill();

                                    // Flecha indicadora de orientación
                                    ctx.strokeStyle = '#facc15';
                                    ctx.lineWidth = 3;
                                    ctx.beginPath();
                                    ctx.moveTo(0, 0);
                                    ctx.lineTo(16, 0);
                                    ctx.stroke();
                                    ctx.restore();

                                    coordsDiv.innerText = `X: ${posX.toFixed(2)} m | Y: ${posY.toFixed(2)} m | θ: ${theta.toFixed(2)} rad`;
                                }

                                // Suscripciones a los puntos de telemetría emitidos por server.js
                                openmct.objects.get('rover.taxonomy:pos_x').then(obj => {
                                    unsubscribeX = openmct.telemetry.subscribe(obj, datum => {
                                        posX = datum.value;
                                        trail.push({ x: posX, y: posY });
                                        if (trail.length > maxPoints) trail.shift();
                                        render();
                                    });
                                });

                                openmct.objects.get('rover.taxonomy:pos_y').then(obj => {
                                    unsubscribeY = openmct.telemetry.subscribe(obj, datum => {
                                        posY = datum.value;
                                        render();
                                    });
                                });

                                openmct.objects.get('rover.taxonomy:pos_theta').then(obj => {
                                    unsubscribeTheta = openmct.telemetry.subscribe(obj, datum => {
                                        theta = datum.value;
                                        render();
                                    });
                                });

                                render();
                            },
                            destroy() {
                                if (unsubscribeX) unsubscribeX();
                                if (unsubscribeY) unsubscribeY();
                                if (unsubscribeTheta) unsubscribeTheta();
                            }
                        };
                    }
                });

                // 3. Definir el Nodo Raíz e Iniciar
                openmct.objects.addRoot({
                    namespace: 'rover.spacecraft',
                    key: 'rover'
                });
                
                openmct.start(document.getElementById('element-container'));
            })
            .catch(err => console.error("Error cargando el diccionario de telemetría:", err));
    </script>
</body>
</html>
